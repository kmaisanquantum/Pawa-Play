name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pawaplay
          POSTGRES_PASSWORD: pawaplay_ci
          POSTGRES_DB: pawaplay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REGULATORY_MODE: TEST
      DATABASE_URL: postgres://pawaplay:pawaplay_ci@localhost:5432/pawaplay_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm install
      - name: Run migrations
        run: psql "$DATABASE_URL" -f database/migrations/001_init_schema.sql
      - name: Lint & typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Unit + integration tests
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npm run build
